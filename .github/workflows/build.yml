name: Build Pong for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install pygame pyinstaller

      - name: Build Pong
        run: |
          python -m PyInstaller --clean --onefile --windowed --name Pong Pong_v1.7.1.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Pong-Windows
          path: dist/Pong.exe
