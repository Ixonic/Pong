
name: Build Pong

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Pong-Windows
            file: dist/Pong.exe
          - os: ubuntu-latest
            artifact: Pong-Linux
            file: dist/Pong

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install pygame pyinstaller

      - name: Build Pong
        run: |
          python -m PyInstaller --clean --onefile --windowed --name Pong Pong_v1.7.1.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
