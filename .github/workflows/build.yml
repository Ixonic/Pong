
name: Build Pong

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Pong-Windows
            separator: ";"
            extension: ".exe"

          - os: ubuntu-latest
            artifact: Pong-Linux
            separator: ":"
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pygame pyinstaller

      - name: Build Pong
        run: |
          python -m PyInstaller --clean --onefile --windowed --name Pong --add-data "sounds${{ matrix.separator }}sounds" Pong_v1.8.0.py

      - name: Upload Windows/Linux build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Pong${{ matrix.extension }}
